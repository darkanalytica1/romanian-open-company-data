<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">Romanian Open Company Data</title>
  <desc id="d">The CUI check digit: body digits padded to nine, multiplied by the control key 753217532, summed, times ten modulo eleven, with a remainder of ten becoming zero.</desc>
  <style>
    .serif { font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif; }
    .sans  { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono  { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .check { animation: pulse 9s ease-in-out infinite; }
    @keyframes pulse { 0%, 70% { opacity: .6 } 80%, 95% { opacity: 1 } 100% { opacity: .6 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } .check { opacity: 1 } }
  </style>

  <rect width="1200" height="400" fill="#F6F4EF"/>
  <rect x=".5" y=".5" width="1199" height="399" fill="none" stroke="#DAD6CC"/>

  <!-- text column -->
  <text x="64" y="82" class="mono" font-size="12" letter-spacing="1.8" fill="#7A8088">DARKANALYTICA</text>
  <rect x="64" y="108" width="48" height="3" fill="#1F3A5F"/>
  <text x="62" y="176" class="serif" font-size="37" font-weight="600" fill="#1B1F24">Romanian Open Company Data</text>
  <text x="64" y="226" class="sans" font-size="19" fill="#4A5058">Validate fiscal codes, join messy company names,</text>
  <text x="64" y="252" class="sans" font-size="19" fill="#4A5058">and confirm against official EU registers, politely.</text>
  <text x="64" y="330" class="mono" font-size="12" letter-spacing="1.2" fill="#7A8088">PYTHON  ·  STANDARD LIBRARY  ·  OPEN DATA  ·  VIES / EORI</text>

  <line x1="680" y1="56" x2="680" y2="344" stroke="#DAD6CC"/>

  <!-- mechanism strip: CUI 43825150 -->
  <g class="mono">
    <text x="712" y="116" font-size="12" fill="#7A8088">BODY</text>
    <text x="712" y="176" font-size="12" fill="#7A8088">KEY</text>
    <text x="712" y="236" font-size="12" fill="#7A8088">×</text>

    <!-- sliding column highlight -->
    <rect y="86" width="40" height="176" rx="4" fill="#E8EDF3" stroke="#1F3A5F" stroke-width="1.5" x="770">
      <animate attributeName="x" dur="9s" repeatCount="indefinite" calcMode="discrete"
        values="770;814;858;902;946;990;1034;1078;1122;1122" keyTimes="0;0.07;0.14;0.21;0.28;0.35;0.42;0.49;0.56;1"/>
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.63"/>
    </rect>

    <g font-size="17" text-anchor="middle">
      <g fill="#7A8088"><text x="790" y="118">0</text><text x="834" y="118">0</text></g>
      <g fill="#1B1F24"><text x="878" y="118">4</text><text x="922" y="118">3</text><text x="966" y="118">8</text><text x="1010" y="118">2</text><text x="1054" y="118">5</text><text x="1098" y="118">1</text><text x="1142" y="118">5</text></g>
      <g fill="#1F3A5F"><text x="790" y="178">7</text><text x="834" y="178">5</text><text x="878" y="178">3</text><text x="922" y="178">2</text><text x="966" y="178">1</text><text x="1010" y="178">7</text><text x="1054" y="178">5</text><text x="1098" y="178">3</text><text x="1142" y="178">2</text></g>
      <g fill="#4A5058"><text x="790" y="238">0</text><text x="834" y="238">0</text><text x="878" y="238">12</text><text x="922" y="238">6</text><text x="966" y="238">8</text><text x="1010" y="238">14</text><text x="1054" y="238">25</text><text x="1098" y="238">3</text><text x="1142" y="238">10</text></g>
    </g>
    <line x1="770" y1="140" x2="1162" y2="140" stroke="#DAD6CC"/>
    <line x1="770" y1="200" x2="1162" y2="200" stroke="#DAD6CC"/>

    <text x="712" y="298" font-size="14" fill="#1B1F24">Σ 78  ×10 = 780   mod 11 = 10  →</text>
    <g class="check">
      <rect x="1092" y="274" width="40" height="36" rx="4" fill="#F6E9E6" stroke="#A33A2B" stroke-width="1.5"/>
      <text x="1112" y="299" font-size="18" text-anchor="middle" fill="#A33A2B">0</text>
    </g>
    <text x="712" y="352" font-size="12" fill="#7A8088">CUI 4382515·0  ·  CONTROL KEY 7 5 3 2 1 7 5 3 2</text>
  </g>
</svg>
